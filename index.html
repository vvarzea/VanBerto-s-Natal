.game-card{

#fixed-robot-wrap{
  position:absolute;
  bottom:calc(.5rem + env(safe-area-inset-bottom,0px));

}
#fixed-bubble{
  --bc:#dcebff;
  background:linear-gradient(135deg,var(--bc),#fff);
  border:3px solid #0f172a;outline:2px solid #1e293b;outline-offset:-4px;
  border-radius:16px;padding:6px 10px 5px;
  box-shadow:3px 3px 0 #0f172a;
  font-family:"Comic Sans MS","Trebuchet MS",sans-serif;
  font-size:clamp(.62rem,1.5vw,.78rem);font-weight:bold;color:#0f172a;
  max-width:180px;min-width:80px;text-align:center;
  pointer-events:none;position:relative;
  opacity:0;transform:translateY(-6px) scale(.88);
  transition:opacity .38s,transform .38s cubic-bezier(.34,1.56,.64,1);
  margin-bottom:4px;
}
#fixed-bubble::after{content:"";position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);border-left:10px solid transparent;border-right:10px solid transparent;border-top:14px solid #0f172a;}
#fixed-bubble::before{content:"";position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid var(--bc);z-index:1;}
#fixed-bubble.show{opacity:1;transform:translateY(0) scale(1);}
#fixed-vb-robot{
  width:clamp(60px,8vw,88px);height:auto;display:block;cursor:pointer;
  animation:vbFloat 3s ease-in-out infinite;
  filter:drop-shadow(0 0 12px #7dd3fc);
}
#fixed-vb-robot:focus-visible{outline:3px solid #ffd700;outline-offset:4px;border-radius:12px;}

#fixed-vb-robot.bounce{animation:robotPop .65s cubic-bezier(.34,1.56,.64,1),vbFloat 3s ease-in-out .65s infinite;}
@keyframes vbFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
@keyframes robotPop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-18px) rotate(-6deg)}70%{transform:translateY(-8px) rotate(5deg)}}
#fixed-robot-name{

    cfVan(ctx,62.5,35.5,3,"rgba(255,120,120,0.55)");
  } else if(blink==="sad"){
    ctx.strokeStyle="#0a0f1c"; ctx.lineWidth=2.3; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(37,24); ctx.lineTo(44.5,27); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(59,24); ctx.lineTo(51.5,27); ctx.stroke();
    ctx.fillStyle="#0a0f1c";
    ctx.beginPath(); ctx.ellipse(41,32,2.8,3.1,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(55,32,2.8,3.1,0,0,Math.PI*2); ctx.fill();
    cfVan(ctx,42,30.7,1.1,"#fff"); cfVan(ctx,56,30.7,1.1,"#fff");
    ctx.fillStyle="#6fd0ff";
    ctx.beginPath();
    ctx.moveTo(56,35); ctx.quadraticCurveTo(59,40,56,43.5); ctx.quadraticCurveTo(53,40,56,35);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.lineWidth=3; ctx.strokeStyle="#0a0f1c";
    ctx.beginPath(); ctx.arc(41,31,3.5,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(55,31,3.5,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  }
  ctx.fillStyle="#0a0f1c";
  if(blink==="wink"){
    ctx.beginPath(); ctx.ellipse(48,36,5.6,3.6,0,0,Math.PI); ctx.fill();
    ctx.fillStyle="#ff7a7a";
    ctx.beginPath(); ctx.ellipse(48,37.6,2.9,1.7,0,0,Math.PI); ctx.fill();
  } else if(blink==="happy"){
    ctx.beginPath(); ctx.ellipse(48,36,6.2,4.2,0,0,Math.PI); ctx.fill();
    ctx.fillStyle="#ff7a7a";
    ctx.beginPath(); ctx.ellipse(48,38,3.2,1.9,0,0,Math.PI); ctx.fill();
  } else if(blink==="sad"){
    ctx.strokeStyle="#0a0f1c"; ctx.lineWidth=2.4; ctx.lineCap="round";
    ctx.beginPath(); ctx.arc(48,40,4.2,Math.PI,Math.PI*2); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.ellipse(48,36,4.6,3.2,0,0,Math.PI); ctx.fill();
    ctx.fillStyle="#ff7a7a";
    ctx.beginPath(); ctx.ellipse(48,37.4,2.4,1.5,0,0,Math.PI); ctx.fill();
  }
  ctx.restore();
}

const MSGS=[
  'Feliz Natal! 🎄',
  'Ho ho ho! Já viste o meu gorro? 🎅',
  'Escolhe uma missão e diverte-te! 🎮',
  'Podes jogar mais do que um jogo! ⭐',
  'O Natal é para partilhar! 🎁',
];
let bubT=null;
function showBub(msg){
  const b=document.getElementById('fixed-bubble');
  b.textContent=msg;b.classList.add('show');
  clearTimeout(bubT);bubT=setTimeout(()=>b.classList.remove('show'),3500);
}

const vbRobot=document.getElementById('fixed-vb-robot');
const vbCtx=vbRobot.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,3);
vbRobot.width=96*DPR;vbRobot.height=96*DPR;vbCtx.scale(DPR,DPR);
const REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let vbBusy=false;

function santaHat(ctx){
  ctx.save();ctx.lineJoin='round';ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(29,25);ctx.bezierCurveTo(30,11,44,5,58,10);ctx.bezierCurveTo(66,13,71,19,72,28);ctx.lineTo(29,25);ctx.closePath();
  ctx.fillStyle='#dc2626';ctx.fill();ctx.lineWidth=2.4;ctx.strokeStyle='#101a30';ctx.stroke();
  rrVan(ctx,25,22,48,9,4.5);ctx.fillStyle='#ffffff';ctx.fill();ctx.lineWidth=2.4;ctx.strokeStyle='#101a30';ctx.stroke();
  cfVan(ctx,72,28,5,'#ffffff');ctx.beginPath();ctx.arc(72,28,5,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}
function vbSetFrame(blink,step,armsUp){ drawVanBerto(vbCtx,blink,step,armsUp); santaHat(vbCtx); }
vbSetFrame(false,-1,false);

function vbBlink(){
  if(vbBusy)return;
  vbSetFrame(true,-1,false);
  setTimeout(()=>{ if(!vbBusy) vbSetFrame(false,-1,false); },180);
}

function vbWalk(steps,speed){
  steps=steps||6; speed=speed||170;
  if(vbBusy)return;
  vbBusy=true;
  let i=0;
  const iv=setInterval(()=>{
    vbSetFrame(false, i%2===0?0:1, false);
    i++;
    if(i>=steps){
      clearInterval(iv);
      vbSetFrame(false,-1,false);
      vbBusy=false;
    }
  },speed);
}

function vbJump(){
  if(vbBusy)return;
  vbBusy=true;
  vbRobot.classList.remove('bounce');void vbRobot.offsetWidth;vbRobot.classList.add('bounce');
  vbSetFrame('happy',-1,true);
  setTimeout(()=>{
    vbSetFrame(false,-1,false);
    vbBusy=false;
  },700);
}

setInterval(()=>{
  if(vbBusy||document.hidden||REDUCED||document.documentElement.classList.contains('no-anim'))return;
  const r=Math.random();
  if(r<0.18)vbJump();
  else if(r<0.5)vbWalk();
  else vbBlink();
},3600);

vbRobot.addEventListener('click',()=>{
  vbJump();
  showBub(MSGS[Math.floor(Math.random()*MSGS.length)]);
});
vbRobot.addEventListener('keydown',function(e){
  if(e.key==='Enter'||e.key===' '){
    vbJump();
    showBub(MSGS[Math.floor(Math.random()*MSGS.length)]);
  }
});

setTimeout(function(){showBub('Olá! Sou o VanBerto\'s! Escolhe a tua missão de Natal! 🎄');},900);
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
